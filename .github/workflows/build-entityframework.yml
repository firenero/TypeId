# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build EntityFramework integration

on:
  push:
    branches:
      - main
    tags: 
      - 'typeid-efcore-v*'
    paths:
      - 'src/FastIDs.TypeId.EntityFramework/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FastIDs.TypeId.EntityFramework/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/FastIDs.TypeId.EntityFramework
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8
    - name: Restore dependencies
      run: dotnet restore ./TypeId.EntityFramework/TypeId.EntityFramework.csproj
    - name: Build
      run: dotnet build --no-restore --configuration Release ./TypeId.EntityFramework/TypeId.EntityFramework.csproj
    - name: Test
      run: dotnet test --configuration Release ./TypeId.EntityFramework.Tests/TypeId.EntityFramework.Tests.csproj
    - name: Publish to NuGet
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        dotnet pack --no-build -c Release ./TypeId.EntityFramework -o .
        dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_API_KEY}} --skip-duplicate
