# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Json.NET Serialization

on:
  push:
    branches:
      - main
    tags: 
      - 'typeid-jsonnet-v*'
    paths:
      - 'src/FastIDs.TypeId.Serialization/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FastIDs.TypeId.Serialization/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/FastIDs.TypeId.Serialization
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8
    - name: Restore dependencies
      run: dotnet restore ./TypeId.Serialization.JsonNet/TypeId.Serialization.JsonNet.csproj
    - name: Build
      run: dotnet build --no-restore --configuration Release ./TypeId.Serialization.JsonNet/TypeId.Serialization.JsonNet.csproj
    - name: Test
      run: dotnet test --configuration Release ./TypeId.Serialization.JsonNet.Tests/TypeId.Serialization.JsonNet.Tests.csproj

  pack-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    defaults:
      run:
        working-directory: ./src/FastIDs.TypeId.Serialization
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8
    - name: Restore dependencies
      run: dotnet restore ./TypeId.Serialization.JsonNet/TypeId.Serialization.JsonNet.csproj
    - name: Pack
      run: dotnet pack --no-restore -c Release ./TypeId.Serialization.JsonNet/TypeId.Serialization.JsonNet.csproj -o ./artifacts
    - name: NuGet login (trusted publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push ./artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k $NUGET_API_KEY --skip-duplicate
